# XcodeGen spec — generates EPSQuickLook.xcodeproj on the CI runner.
name: EPSQuickLook

options:
  bundleIdPrefix: local.epsquicklook
  deploymentTarget:
    macOS: "12.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "12.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_HARDENED_RUNTIME: NO
    # Signing is done explicitly by scripts/sign.sh after the build.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

targets:
  EPSQuickLook:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
    settings:
      base:
        PRODUCT_NAME: EPSQuickLook
        PRODUCT_BUNDLE_IDENTIFIER: local.epsquicklook.app
        INFOPLIST_FILE: Support/App-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - target: EPSPreviewExtension
      - target: EPSThumbnailExtension

  EPSPreviewExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/PreviewExtension
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_NAME: EPSPreviewExtension
        PRODUCT_BUNDLE_IDENTIFIER: local.epsquicklook.app.preview
        INFOPLIST_FILE: Support/PreviewExtension-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/PreviewExtension.entitlements

  EPSThumbnailExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/ThumbnailExtension
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_NAME: EPSThumbnailExtension
        PRODUCT_BUNDLE_IDENTIFIER: local.epsquicklook.app.thumbnail
        INFOPLIST_FILE: Support/ThumbnailExtension-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/ThumbnailExtension.entitlements

schemes:
  EPSQuickLook:
    build:
      targets:
        EPSQuickLook: all
    run:
      config: Release
    archive:
      config: Release
